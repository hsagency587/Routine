<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G Work</title>
<!-- Pagina personale: fuori dai motori di ricerca. Un robots.txt qui non
     servirebbe, dovrebbe stare alla radice di hsagency587.github.io. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top" id="top">

  <div class="siren" id="siren" hidden>
    <svg class="siren-svg" viewBox="0 0 48 48" role="img" aria-label="Un evento cade in una finestra protetta">
      <g class="siren-rot">
        <path class="beam" d="M24 30 L-6 17 L-6 43 Z"/>
      </g>
      <path class="dome" d="M11 32 a13 13 0 0 1 26 0 z"/>
      <g class="siren-rot">
        <ellipse class="glint" cx="18" cy="24" rx="3" ry="5"/>
      </g>
      <rect class="base" x="8" y="31" width="32" height="8" rx="2"/>
    </svg>
  </div>

  <p class="fresh" id="fresh">Caricamento…</p>

  <div class="daybar">
    <button type="button" class="nav" id="prev" aria-label="Giorno precedente">&lsaquo;</button>
    <button type="button" class="date" id="dateBtn" aria-label="Torna a oggi">
      <span id="dateMain"></span><span class="rel" id="dateRel"></span>
    </button>
    <button type="button" class="nav" id="next" aria-label="Giorno successivo">&rsaquo;</button>
  </div>

  <div class="prog"><span class="prog-fill" id="progFill"></span></div>

  <p class="stats">
    <span class="pct" id="pct">0%</span>
    <span class="sep">·</span>
    <span class="act" id="act">—</span>
    <span class="sep">·</span>
    <span class="streak" id="streak">serie 0</span>
  </p>

</header>

<main>
  <h1 class="sr-only">G Work — routine del giorno</h1>
  <ol class="list" id="list"></ol>
</main>

<footer class="foot">
  <div class="storico">
    <select class="mese" id="mese" aria-label="Mese dello storico"></select>
    <button type="button" class="scarica" id="scarica">Scarica</button>
  </div>
</footer>

<dialog class="chiusura" id="chiusura" aria-labelledby="chiusuraTit">
  <form method="dialog" class="chiusura-box" id="chiusuraForm">
    <h2 class="chiusura-tit" id="chiusuraTit">Chiusura giornata</h2>
    <p class="chiusura-day" id="chiusuraDay"></p>

    <p class="voto-num" id="votoNum">5.5</p>
    <input type="range" class="voto" id="voto" min="1" max="10" step="0.1" value="5.5"
           aria-label="Voto della giornata, da 1 a 10">
    <p class="voto-scala"><span>1</span><span>10</span></p>

    <label class="commento-lab" for="commento">Commento</label>
    <textarea class="commento" id="commento" rows="5" placeholder="Com'è andata?"></textarea>

    <div class="chiusura-btn">
      <button type="button" class="btn" id="chiusuraAnnulla">Annulla</button>
      <button type="submit" class="btn btn-ok" value="ok">Chiudi la giornata</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
